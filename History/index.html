<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histori Transaksi - Byme.Project</title>
    <link rel="icon" type="image/x-icon" href="../image/IconeByme.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

    <!-- Navbar -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-6 py-6 text-center">
            <h1 class="text-3xl font-extrabold tracking-wide">Transaction History</h1>
            <p class="text-indigo-200 text-sm mt-1 font-medium">Byme.Project</p>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-8 animate-fade-in">
        
        <!-- Search Bar Container -->
        <div class="bg-white rounded-2xl shadow-md p-4 mb-6 border border-slate-200/80 flex items-center space-x-3">
            <svg class="w-5 h-5 text-slate-400 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input type="text" id="searchInput" placeholder="Cari Berdasarkan Nama..." 
                class="w-full text-slate-700 outline-none bg-transparent placeholder-slate-400 font-medium text-sm md:text-base">
        </div>

        <!-- Container List History Transaksi -->
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-200/80">
            <div class="flex justify-between items-center mb-6 border-b pb-3">
                <h2 class="text-xl font-bold text-slate-800">Daftar Transaksi</h2>
                <button id="btnRefresh" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition flex items-center space-x-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Muat Ulang</span>
                </button>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingState" class="py-12 text-center">
                <svg class="animate-spin h-8 w-8 text-indigo-600 mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-slate-500 font-medium text-sm">Memuat data...</p>
            </div>

            <!-- List Container (Desktop: Horizontal Grid, Mobile: Vertical) -->
            <div id="historyList" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Card Item diinjeksi via JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden py-12 text-center text-slate-400">
                <p class="text-base font-medium">Tidak ada data transaksi ditemukan.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-300 text-center py-4 mt-auto">
        <p class="text-sm font-semibold">Byme Project</p>
        <a href="https://www.instagram.com/rapv.rmdhni" target="_blank">
            <p class="text-xs text-indigo-400 mt-0.5">Create by rapv.rmdhni</p>
        </a>
    </footer>

    <!-- Modal Edit Transaksi -->
    <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 animate-fade-in max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="text-lg font-bold text-slate-800">Edit Detail Transaksi</h3>
                <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            </div>

            <form id="editForm" class="space-y-4">
                <input type="hidden" id="editRowId">

                <!-- Nama Lengkap (Disabled / Readonly) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Lengkap (Tidak Dapat Diubah)</label>
                    <input type="text" id="editFullName" readonly class="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-lg text-slate-600 font-medium cursor-not-allowed outline-none">
                </div>

                <!-- Foto Bukti Pembayaran (Disabled / Readonly Viewer) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Bukti Pembayaran (Tidak Dapat Diubah)</label>
                    <div id="editPhotoContainer" class="p-2 border rounded-lg bg-slate-50 flex items-center space-x-3">
                        <img id="editPhotoPreview" src="" alt="Bukti Pembayaran" class="h-14 w-14 object-cover rounded-md border">
                        <a id="editPhotoLink" href="#" target="_blank" class="text-xs font-semibold text-indigo-600 hover:underline">Lihat Gambar Penuh &rarr;</a>
                    </div>
                </div>

                <!-- Tanggal Bayar -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Tanggal Pembayaran</label>
                    <input type="date" id="editPaymentDate" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <!-- Metode Pembayaran -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Metode Pembayaran</label>
                    <select id="editPaymentMethod" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        <option value="Cash">Cash</option>
                        <option value="Transfer E-Wallet">Transfer E-Wallet</option>
                        <option value="Transfer E-Banking">Transfer E-Banking</option>
                    </select>
                </div>

                <!-- Nominal Pembayaran -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nominal Pembayaran (Rp)</label>
                    <input type="text" id="editAmount" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none font-semibold">
                </div>

                <!-- Kategori Pembayaran -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Kategori Pembayaran</label>
                    <select id="editPaymentCategory" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        <option value="Bayar Dimuka">Bayar Dimuka</option>
                        <option value="Tunai">Tunai</option>
                    </select>
                </div>

                <!-- Catatan Tambahan -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Catatan Tambahan</label>
                    <textarea id="editNotes" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-3 border-t">
                    <button type="button" id="btnCancelEdit" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 transition text-sm font-semibold">Batal</button>
                    <button type="button" id="btnSaveEdit" class="px-5 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition text-sm font-semibold">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Pop-up Sukses (Custom Record Payment Alert) -->
    <div id="successModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-[60]">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center animate-fade-in border border-slate-100">
            <!-- Icon Success Animasi/Tailwind -->
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-4">
                <svg class="h-10 w-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mb-1">Berhasil Disimpan!</h3>
            <p id="successModalMessage" class="text-sm text-slate-500 font-medium mb-6">Data transaksi berhasil diperbarui.</p>
            <button id="btnCloseSuccessModal" type="button" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition font-semibold text-sm shadow-md hover:shadow-indigo-200">
                OK, Mengerti
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwTS76YkP45rtG9RNp_1Xrn4qtzPaqdYYtDP3uewLjOeSZy2T_NlQlAW4L76l4JO2RF/exec";

        let transactionsData = [];

        const searchInput = document.getElementById('searchInput');
        const historyList = document.getElementById('historyList');
        const loadingState = document.getElementById('loadingState');
        const emptyState = document.getElementById('emptyState');
        const btnRefresh = document.getElementById('btnRefresh');

        const editModal = document.getElementById('editModal');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const btnCancelEdit = document.getElementById('btnCancelEdit');
        const btnSaveEdit = document.getElementById('btnSaveEdit');
        const editAmount = document.getElementById('editAmount');

        // Format Ribuan pada Input Nominal Edit
        editAmount.addEventListener('input', function() {
            let value = this.value.replace(/\D/g, '');
            this.value = value ? new Intl.NumberFormat('id-ID').format(value) : '';
        });

        // Helper Konversi URL Google Drive ke Direct Image Link
        function getDirectDriveUrl(url) {
            if (!url || url === '-') return 'https://via.placeholder.com/150?text=No+Image';
            if (url.includes('drive.google.com')) {
                const matches = url.match(/[-\w]{25,}/);
                if (matches) {
                    return `https://lh3.googleusercontent.com/d/${matches[0]}`;
                }
            }
            return url;
        }

        // Load Data dari Apps Script
        async function fetchTransactions() {
            loadingState.classList.remove('hidden');
            historyList.classList.add('hidden');
            emptyState.classList.add('hidden');

            try {
                const response = await fetch(SCRIPT_URL + "?action=read");
                const result = await response.json();

                if (result.status === 'success') {
                    transactionsData = result.data;
                    renderTransactions(transactionsData);
                } else {
                    alert('Gagal memuat data: ' + result.message);
                }
            } catch (error) {
                console.error(error);
                alert('Terjadi kesalahan koneksi saat mengambil data.');
            } finally {
                loadingState.classList.add('hidden');
            }
        }

        // Render List Transaksi
        function renderTransactions(data) {
            historyList.innerHTML = '';

            if (!data || data.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            historyList.classList.remove('hidden');

            data.forEach(item => {
                const formattedAmount = new Intl.NumberFormat('id-ID').format(item.amount);
                const imageUrl = getDirectDriveUrl(item.photoUrl);

                const card = document.createElement('div');
                card.className = "p-4 bg-slate-50 hover:bg-indigo-50/50 rounded-xl border border-slate-200 transition cursor-pointer flex items-center space-x-4 shadow-sm hover:shadow-md";
                card.onclick = () => openEditModal(item);

                card.innerHTML = `
                    <img src="${imageUrl}" 
                        loading="lazy"
                        alt="Bukti" 
                        class="h-16 w-16 object-cover rounded-lg border flex-shrink-0 bg-slate-200"
                        onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=Error';">
                    <div class="flex-grow overflow-hidden">
                        <h4 class="font-bold text-slate-800 text-base truncate">${item.fullName}</h4>
                        <p class="text-xs text-slate-500 font-medium">${item.paymentDate} • <span class="text-indigo-600 font-semibold">${item.paymentMethod}</span></p>
                        <p class="text-sm font-extrabold text-slate-900 mt-1">Rp ${formattedAmount}</p>
                    </div>
                    <div class="flex-shrink-0">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${item.paymentCategory === 'Tunai' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                            ${item.paymentCategory}
                        </span>
                    </div>
                `;
                historyList.appendChild(card);
            });
        }

        // Filter Pencarian Real-time
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const filtered = transactionsData.filter(item => item.fullName.toLowerCase().includes(query));
            renderTransactions(filtered);
        });

        // Buka Modal Edit
        function openEditModal(item) {
            document.getElementById('editRowId').value = item.rowId;
            document.getElementById('editFullName').value = item.fullName;
            document.getElementById('editPaymentDate').value = item.paymentDate;
            document.getElementById('editPaymentMethod').value = item.paymentMethod;
            document.getElementById('editAmount').value = new Intl.NumberFormat('id-ID').format(item.amount);
            document.getElementById('editPaymentCategory').value = item.paymentCategory;
            document.getElementById('editNotes').value = item.notes;

            const photoPreview = document.getElementById('editPhotoPreview');
            const photoLink = document.getElementById('editPhotoLink');
            const imageUrl = getDirectDriveUrl(item.photoUrl);

            if (item.photoUrl && item.photoUrl !== '-') {
                photoPreview.src = imageUrl;
                photoLink.href = imageUrl;
                photoLink.classList.remove('hidden');
            } else {
                photoPreview.src = 'https://via.placeholder.com/150?text=No+Image';
                photoLink.classList.add('hidden');
            }

            editModal.classList.remove('hidden');
            editModal.classList.add('flex');
        }

        function closeModal() {
            editModal.classList.add('hidden');
            editModal.classList.remove('flex');
        }

        btnCloseModal.onclick = closeModal;
        btnCancelEdit.onclick = closeModal;
        btnRefresh.onclick = fetchTransactions;

        // Simpan Perubahan Data (Update ke Spreadsheet)
        btnSaveEdit.addEventListener('click', async function() {
            const rowId = document.getElementById('editRowId').value;
            const paymentDate = document.getElementById('editPaymentDate').value;
            const paymentMethod = document.getElementById('editPaymentMethod').value;
            const amount = editAmount.value.replace(/\./g, '');
            const paymentCategory = document.getElementById('editPaymentCategory').value;
            const notes = document.getElementById('editNotes').value.trim();

            if (!paymentDate || !paymentMethod || !amount || !paymentCategory) {
                alert('Mohon lengkapi semua data!');
                return;
            }

 // Function Helper untuk Menampilkan Pop-up Sukses
function showSuccessModal(message) {
    const successModal = document.getElementById('successModal');
    const successModalMessage = document.getElementById('successModalMessage');
    const btnCloseSuccessModal = document.getElementById('btnCloseSuccessModal');

    if (message) successModalMessage.innerText = message;

    successModal.classList.remove('hidden');
    successModal.classList.add('flex');

    btnCloseSuccessModal.onclick = () => {
        successModal.classList.add('hidden');
        successModal.classList.remove('flex');
    };
}

// Handler Simpan Perubahan
btnSaveEdit.addEventListener('click', async function() {
    const rowId = document.getElementById('editRowId').value;
    const paymentDate = document.getElementById('editPaymentDate').value;
    const paymentMethod = document.getElementById('editPaymentMethod').value;
    const amount = editAmount.value.replace(/\./g, '');
    const paymentCategory = document.getElementById('editPaymentCategory').value;
    const notes = document.getElementById('editNotes').value.trim();

    if (!paymentDate || !paymentMethod || !amount || !paymentCategory) {
        alert('Mohon lengkapi semua data!');
        return;
    }

    btnSaveEdit.disabled = true;
    btnSaveEdit.innerText = "Memproses...";

    const payload = {
        action: "update",
        rowId: rowId,
        paymentDate: paymentDate,
        paymentMethod: paymentMethod,
        amount: amount,
        paymentCategory: paymentCategory,
        notes: notes
    };

    try {
        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === 'success') {
            closeModal(); // Tutup modal form edit
            showSuccessModal('Data transaksi berhasil diperbarui!'); // Tampilkan Pop-up Sukses Custom
            fetchTransactions(); // Refresh data list history
        } else {
            alert('Gagal memperbarui data: ' + result.message);
        }
    } catch (error) {
        console.error(error);
        alert('Terjadi kesalahan koneksi saat memperbarui data.');
    } finally {
        btnSaveEdit.disabled = false;
        btnSaveEdit.innerText = "Simpan Perubahan";
    }
});
        });

        // Load data saat pertama kali dibaca
        window.onload = fetchTransactions;
    </script>
</body>
</html>
